name: CI

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: brewstead_test
          POSTGRES_USER: brewstead
          POSTGRES_PASSWORD: brewstead
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brewstead -d brewstead_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_URL: jdbc:postgresql://localhost:5432/brewstead_test
      DB_USERNAME: brewstead
      DB_PASSWORD: brewstead
      JPA_SHOW_SQL: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 26
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "26"
          cache: maven

      - name: Set up Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2.1.2
        with:
          chrome-version: stable
          install-chromedriver: true

      - name: Verify Java project
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
          CHROMEDRIVER_PATH: ${{ steps.setup-chrome.outputs.chromedriver-path }}
        run: |
          chmod +x mvnw
          ./mvnw -B clean verify

      - name: Validate JSON catalogues
        run: |
          python -m json.tool src/main/resources/data/ingredients.json >/dev/null
          python -m json.tool src/main/resources/data/crops.json >/dev/null
          python -m json.tool src/main/resources/data/recipes.json >/dev/null

      - name: Check JavaScript syntax
        run: |
          node --check src/main/resources/static/js/brewstead-cadence.js
          node --check src/main/resources/static/js/brewstead-data.js
          node --check src/main/resources/static/js/brewstead-world.js
          node --check src/main/resources/static/js/brewstead-personnage.js
          node --check src/main/resources/static/js/brewstead-scenes.js
          node --check src/main/resources/static/js/brewstead-visite.js
          node --check src/main/resources/static/js/brewstead-app.js

      - name: Test frontend data and failure handling
        run: node --test src/test/js/*.test.cjs

      - name: Upload browser playtest captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brewstead-playtest
          path: target/playtest/*.png
          if-no-files-found: warn
