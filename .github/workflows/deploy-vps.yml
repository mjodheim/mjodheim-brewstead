name: Deploy Brewstead to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brewstead-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on:
      - self-hosted
      - linux
      - x64
      - brewstead-prod
    timeout-minutes: 20

    steps:
      - name: Deploy
        run: |
          set -Eeuo pipefail

          cd /opt/brewstead

          git fetch --prune origin main
          git checkout main
          git reset --hard origin/main

          chmod +x scripts/deploy-vps.sh
          ./scripts/deploy-vps.sh
