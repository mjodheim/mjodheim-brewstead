name: Genesis V21 physical shared first wave

on:
  push:
    branches: [research/genesis-v21-transfer-calibration]
    paths:
      - ".github/workflows/genesis-v21-first-wave-evaluate.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  APPARATUS_HEAD: 3b78a5f201b16c5db7fb248e06389792aed1ff9b
  HOST_COMMIT: 720b27c8bc80de16c04953e13d5f9e8425beea8c

jobs:
  evaluate:
    strategy:
      fail-fast: false
      matrix:
        task:
          - brewstead-chat-rate-window
          - brewstead-farm-plant-ownership
          - brewstead-brew-quality-bonus
        arm: [g1, g2]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.APPARATUS_HEAD }}
          path: apparatus
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HOST_COMMIT }}
          path: host
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "26"
          cache: maven
          cache-dependency-path: host/pom.xml

      - name: Reconstruct exact defected root
        env:
          TASK: ${{ matrix.task }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          bank=json.loads(Path("apparatus/.genesis-v21/TRANSFER_TASK_BANK.json").read_text())
          task=next(x for x in bank["tasks"] if x["id"]==os.environ["TASK"])
          p=Path("host")/task["source_path"]
          s=p.read_text()
          if s.count(task["old_text"])!=1:
              raise SystemExit("defect site mismatch")
          p.write_text(s.replace(task["old_text"],task["defect_text"],1))
          PY

      - name: Apply frozen accepted shared patch
        env:
          TASK: ${{ matrix.task }}
        shell: bash
        run: |
          set -euo pipefail
          cd host
          git apply "../apparatus/.genesis-v21/candidates/$TASK/proposal.patch"

      - name: Reverify frozen public guard
        working-directory: host
        shell: bash
        run: ./mvnw -q -Dtest='*ServiceTest,*ControllerTest,DomainBehaviorTest,RequestValidationTest,MapperTest,GameClockTest,ApiExceptionHandlerTest' test

      - name: Install evaluator-only objective
        env:
          TASK: ${{ matrix.task }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,shutil
          from pathlib import Path
          bank=json.loads(Path("apparatus/.genesis-v21/TRANSFER_TASK_BANK.json").read_text())
          task=next(x for x in bank["tasks"] if x["id"]==os.environ["TASK"])
          src=Path("apparatus/.genesis-v21/evaluator")/Path(task["hidden_test_source"]).name
          dst=Path("host/src/test/java/be/mjodheim/brewstead/service")/src.name
          shutil.copy2(src,dst)
          PY

      - name: Execute one transfer-evaluator observation
        env:
          TASK: ${{ matrix.task }}
          ARM: ${{ matrix.arm }}
        shell: bash
        run: |
          set -euo pipefail
          selector=$(python - <<'PY'
          import json,os
          from pathlib import Path
          bank=json.loads(Path("apparatus/.genesis-v21/TRANSFER_TASK_BANK.json").read_text())
          task=next(x for x in bank["tasks"] if x["id"]==os.environ["TASK"])
          print(task["hidden_test_selector"])
          PY
          )
          set +e
          (cd host && ./mvnw -q -Dtest="$selector" test)
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then quality=1000; passed=true; else quality=0; passed=false; fi
          patch_sha=$(sha256sum "apparatus/.genesis-v21/candidates/$TASK/proposal.patch" | awk '{print $1}')
          python - <<PY
          import json
          result={
            "schema":"mira-genesis-rsi-v21-transfer-observation-v1",
            "task_id":"$TASK",
            "arm_id":"$ARM",
            "host_commit":"$HOST_COMMIT",
            "apparatus_commit":"$APPARATUS_HEAD",
            "proposal_patch_sha256":"$patch_sha",
            "public_guard_pass":True,
            "transfer_evaluator_spent":True,
            "evaluator_objective_pass":$passed,
            "quality_milli":int("$quality"),
            "github_actions_run_id":int("$GITHUB_RUN_ID"),
            "github_actions_job":"$GITHUB_JOB",
          }
          print("GENESIS_RSI_V21_OBSERVATION="+json.dumps(result,sort_keys=True))
          open("/tmp/result.json","w").write(json.dumps(result,indent=2,sort_keys=True)+"\n")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: v21-${{ matrix.task }}-${{ matrix.arm }}-result
          path: /tmp/result.json
          if-no-files-found: error
          retention-days: 90
