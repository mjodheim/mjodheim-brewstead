name: Tavern debug

on:
  push:
    branches:
      - feature/taverne-sociale-vivante
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tavern:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: brewstead_test
          POSTGRES_USER: brewstead
          POSTGRES_PASSWORD: brewstead
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brewstead -d brewstead_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_URL: jdbc:postgresql://localhost:5432/brewstead_test
      DB_USERNAME: brewstead
      DB_PASSWORD: brewstead
      JPA_SHOW_SQL: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "26"
          cache: maven
      - id: setup-chrome
        uses: browser-actions/setup-chrome@v2.1.2
        with:
          chrome-version: stable
          install-chromedriver: true
      - name: Run focused tavern browser test
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
          CHROMEDRIVER_PATH: ${{ steps.setup-chrome.outputs.chromedriver-path }}
        run: |
          chmod +x mvnw
          ./mvnw -B -Dtest=BrewsteadUiIntegrationTest#tavernRoomsSeatsCharactersChatAndEmotesFeelLikeAPlace test
      - name: Upload focused captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tavern-debug-captures
          path: target/playtest/*.png
          if-no-files-found: warn
