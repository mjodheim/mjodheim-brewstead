<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1b1309">
    <title>Fonder un domaine · Mjödheim Brewstead</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232b1c10'/%3E%3Cpath d='M16 27V13' stroke='%23e9bc55' stroke-width='2' stroke-linecap='round'/%3E%3Cpath d='M16 13c0-3.4 2.3-5.7 4.9-6.9.5 3.6-1.3 6.9-4.9 6.9Z' fill='%23e9bc55'/%3E%3Cpath d='M16 19c0-2.9-2.3-4.7-4.9-5.4-.4 3 1.3 5.4 4.9 5.4Z' fill='%23e9bc55'/%3E%3Cpath d='M16 19c0-2.9 2.3-4.7 4.9-5.4.4 3-1.3 5.4-4.9 5.4Z' fill='%23e9bc55'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&display=swap">
    <link rel="stylesheet" th:href="@{/css/brewstead.css}" href="/css/brewstead.css">
    <link rel="stylesheet" th:href="@{/css/brewstead-auth.css}" href="/css/brewstead-auth.css">
</head>
<body>

<div class="gate-bg" aria-hidden="true"></div>

<main class="gate panel">
    <div class="gate__crest">
        <span class="gate__mark" aria-hidden="true">
            <svg viewBox="0 0 24 24">
                <path d="M12 21V8"/>
                <path d="M12 8c0-3 2-5 4-6 .4 3-1 6-4 6Z"/>
                <path d="M12 13c0-2.5 2-4 4-4.6.3 2.6-1.2 4.6-4 4.6Z"/>
                <path d="M12 18c0-2.5 2-4 4-4.6.3 2.6-1.2 4.6-4 4.6Z"/>
                <path d="M12 13c0-2.5-2-4-4-4.6-.3 2.6 1.2 4.6 4 4.6Z"/>
                <path d="M12 18c0-2.5-2-4-4-4.6-.3 2.6 1.2 4.6 4 4.6Z"/>
            </svg>
        </span>
        <h1>Brewstead</h1>
        <p>Craft · Farm · Brew · Trade</p>
    </div>

    <h2>Fonder ton domaine</h2>
    <p class="gate__intro">Trois champs, deux ruches et de quoi lancer ton premier brassin t'attendent.</p>

    <p class="notice notice--error" th:if="${error}" th:text="${error}" role="alert">Message d'erreur</p>

    <form th:action="@{/register}" action="/register" th:object="${form}" method="post">
        <label class="field">
            <span>Nom de brasseur</span>
            <input type="text" th:field="*{username}" name="username" autocomplete="username"
                   required minlength="3" maxlength="20" pattern="[A-Za-z0-9_\-]+" autofocus placeholder="Eirik">
            <small>3 à 20 caractères : lettres, chiffres, tiret ou tiret bas. C'est ton identifiant de connexion.</small>
        </label>

        <label class="field">
            <span>Mot de passe</span>
            <input type="password" th:field="*{password}" name="password" autocomplete="new-password"
                   required minlength="8" maxlength="72" placeholder="••••••••">
            <small>Au moins 8 caractères.</small>
        </label>

        <label class="field">
            <span>Confirmation</span>
            <input type="password" th:field="*{confirmation}" name="confirmation" autocomplete="new-password"
                   required minlength="8" maxlength="72" placeholder="••••••••">
        </label>

        <button class="btn btn--gold" type="submit">Fonder le domaine</button>
    </form>

    <p class="gate__foot">
        Tu as déjà un domaine ?
        <a th:href="@{/login}" href="/login">Connecte-toi</a>
    </p>
</main>

<p class="gate__seal">Le nom affiché dans le jeu pourra être changé à tout moment depuis ton compte.</p>

</body>
</html>
