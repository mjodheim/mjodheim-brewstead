<svg xmlns="http://www.w3.org/2000/svg" xmlns:th="http://www.thymeleaf.org"
     th:fragment="atmosphere" class="world__life" viewBox="0 0 1536 742" aria-hidden="true" focusable="false">
    <defs>
        <!-- Coordinates belong to the 1536 × 742 illustration, not the viewport. -->
        <clipPath id="near-fall-mask">
            <path d="M768 449 Q816 454 857 442 L840 480 823 512 794 536 746 553 750 522 760 492Z"/>

        <clipPath id="river-mask">

            <path d="M330 677 L372 644 435 634 443 669 431 696 407 742 322 742Z"/>

        <linearGradient id="fall-light" x2="0" y2="1">
            <stop stop-color="#eafaff" stop-opacity=".03"/>
            <stop offset=".65" stop-color="#d4f4fa" stop-opacity=".28"/>
            <stop offset="1" stop-color="#fff" stop-opacity=".05"/>
        </linearGradient>
        <pattern id="fall-threads" width="83" height="74" patternUnits="userSpaceOnUse">
            <path d="M6-10 Q18 4 12 24 T7 58 M29 8 Q21 33 28 48 T24 82 M48-8 Q56 12 44 39 T48 77 M70 17 Q63 38 73 57"

            <path d="M15 35 13 48 M37 1 34 19 M60 46 55 65 M78 5 76 21" stroke="#fff" stroke-width="1" opacity=".55"/>
        </pattern>
        <pattern id="river-lines" width="120" height="46" patternUnits="userSpaceOnUse">
            <path d="M-10 14 Q5 6 25 12 T61 11 M69 30 Q85 24 112 29 M36 42 Q49 37 67 40"
                  fill="none" stroke="#b7e5e9" stroke-width="1.2" opacity=".55"/>
        </pattern>
        <radialGradient id="foam-light">
            <stop stop-color="#eaffff" stop-opacity=".52"/>
            <stop offset=".55" stop-color="#cae6ed" stop-opacity=".18"/>
            <stop offset="1" stop-color="#d8f4f4" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="lamp-halo">
            <stop stop-color="#fff5bf" stop-opacity=".95"/>
            <stop offset=".18" stop-color="#ffe2a0" stop-opacity=".8"/>
            <stop offset=".46" stop-color="#ffb441" stop-opacity=".32"/>
            <stop offset="1" stop-color="#ff9b28" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="cloud-soft">
            <stop stop-color="#eff4e9" stop-opacity=".48"/>
            <stop offset=".52" stop-color="#edf1ed" stop-opacity=".2"/>
            <stop offset="1" stop-color="#d5e3e6" stop-opacity="0"/>
        </radialGradient>
        <filter id="soft-vapour" x="-.15" y="-.4" width="1.3" height="1.8">
            <feGaussianBlur stdDeviation="5"/>
        </filter>
    </defs>

    <g class="cloud-bank cloud-bank--near" filter="url(#soft-vapour)">
        <ellipse cx="148" cy="33" rx="204" ry="51" fill="url(#cloud-soft)"/>
        <ellipse cx="321" cy="39" rx="135" ry="32" fill="url(#cloud-soft)"/>
        <ellipse cx="217" cy="15" rx="98" ry="40" fill="url(#cloud-soft)"/>
    </g>
    <g class="cloud-bank cloud-bank--far" filter="url(#soft-vapour)">
        <ellipse cx="900" cy="28" rx="228" ry="40" fill="url(#cloud-soft)"/>
        <ellipse cx="1102" cy="14" rx="181" ry="38" fill="url(#cloud-soft)"/>
    </g>
    <g class="chimney-smoke" fill="url(#foam-light)">
        <ellipse cx="821" cy="83" rx="13" ry="21"/>
        <ellipse cx="833" cy="61" rx="24" ry="20"/>
    </g>

    <g clip-path="url(#far-fall-mask)" class="fall fall--far">
        <rect x="1280" y="55" width="200" height="170" fill="url(#fall-light)"/>
        <g class="fall__flow fall__flow--far"><rect x="1280" y="-40" width="200" height="320" fill="url(#fall-threads)"/></g>
    </g>
    <g clip-path="url(#near-fall-mask)" class="fall fall--near">
        <rect x="740" y="440" width="122" height="118" fill="url(#fall-light)"/>
        <g class="fall__flow"><rect x="730" y="340" width="150" height="240" fill="url(#fall-threads)"/></g>

    </g>
    <g clip-path="url(#river-mask)">
        <g class="water-shimmer"><rect x="300" y="530" width="830" height="260" fill="url(#river-lines)"/></g>
    </g>
    <g class="water-sparks" stroke="#f3ffff" stroke-width="1.4" stroke-linecap="round">
        <path class="water-spark" d="M1168 199h12 m10 3h4 M1117 242h7 M685 623h8 M837 688h11"/>
        <path class="water-spark water-spark--late" d="M982 197h7 M1254 215h12 M702 704h13 M763 657h6 M378 690h9"/>
    </g>

    <g class="tavern-glow" fill="url(#lamp-halo)">
        <ellipse cx="1041" cy="471" rx="23" ry="28"/>
        <ellipse cx="940" cy="527" rx="21" ry="24"/>
        <ellipse cx="1045" cy="537" rx="24" ry="25"/>
        <ellipse cx="1092" cy="534" rx="18" ry="24"/>
        <ellipse cx="1135" cy="538" rx="21" ry="22"/>
    </g>
    <g class="window-lights" fill="url(#lamp-halo)">
        <ellipse cx="694" cy="216" rx="18" ry="23"/>
        <ellipse cx="704" cy="268" rx="20" ry="25"/>
        <ellipse cx="777" cy="278" rx="16" ry="23"/>
        <ellipse cx="853" cy="280" rx="16" ry="23"/>
        <ellipse cx="182" cy="494" rx="22" ry="26"/>
        <ellipse cx="1286" cy="363" rx="15" ry="21"/>
        <ellipse cx="1384" cy="369" rx="17" ry="24"/>
    </g>
    <g class="lantern-lights" fill="url(#lamp-halo)">
        <circle cx="1279" cy="536" r="29"/>
        <circle cx="1312" cy="554" r="18"/>
        <circle cx="618" cy="500" r="13"/>
        <circle cx="884" cy="535" r="14"/>
    </g>
</svg>
