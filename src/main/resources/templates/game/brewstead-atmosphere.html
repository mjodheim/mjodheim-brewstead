<div xmlns:th="http://www.thymeleaf.org" th:fragment="atmosphere" class="world__life" aria-hidden="true">
    <!-- Pourquoi des calques séparés.

         L'ambiance tenait dans un seul SVG de la taille du tableau. Or un
         navigateur ne sait pas déplacer un morceau d'un SVG : quand une
         cascade coule à l'intérieur, il repeint le SVG entier — masque d'eau,
         mélanges « screen » et flous compris — à chaque image. Sur un
         portable, la carte tombait à une douzaine d'images par seconde sans
         qu'on touche à rien.

         Chaque élément qui bouge est donc son propre petit SVG, posé aux
         coordonnées qu'il avait dans le tableau (1536 × 742). Il est peint
         une fois ; ensuite la carte graphique se contente de le glisser ou de
         le faire respirer. Le dessin, lui, n'a pas changé. -->
    <svg class="sprite" focusable="false">
        <defs>
            <linearGradient id="fall-light" x2="0" y2="1">
                <stop stop-color="#eafaff" stop-opacity=".03"/>
                <stop offset=".65" stop-color="#d4f4fa" stop-opacity=".28"/>
                <stop offset="1" stop-color="#fff" stop-opacity=".05"/>
            </linearGradient>
            <pattern id="fall-threads" width="83" height="74" patternUnits="userSpaceOnUse">
                <path d="M6-10 Q18 4 12 24 T7 58 M29 8 Q21 33 28 48 T24 82 M48-8 Q56 12 44 39 T48 77 M70 17 Q63 38 73 57"
                      fill="none" stroke="#e2f8ff" stroke-width="2.2" opacity=".48"/>
                <path d="M15 35 13 48 M37 1 34 19 M60 46 55 65 M78 5 76 21" stroke="#fff" stroke-width="1" opacity=".55"/>
            </pattern>
            <pattern id="river-lines" width="120" height="46" patternUnits="userSpaceOnUse">
                <path d="M-10 14 Q5 6 25 12 T61 11 M69 30 Q85 24 112 29 M36 42 Q49 37 67 40"
                      fill="none" stroke="#b7e5e9" stroke-width="1.2" opacity=".55"/>
            </pattern>
            <radialGradient id="foam-light">
                <stop stop-color="#eaffff" stop-opacity=".52"/>
                <stop offset=".55" stop-color="#cae6ed" stop-opacity=".18"/>
                <stop offset="1" stop-color="#d8f4f4" stop-opacity="0"/>
            </radialGradient>
            <radialGradient id="lamp-halo">
                <stop stop-color="#fff5bf" stop-opacity=".95"/>
                <stop offset=".18" stop-color="#ffe2a0" stop-opacity=".8"/>
                <stop offset=".46" stop-color="#ffb441" stop-opacity=".32"/>
                <stop offset="1" stop-color="#ff9b28" stop-opacity="0"/>
            </radialGradient>
            <radialGradient id="cloud-soft">
                <stop stop-color="#eff4e9" stop-opacity=".48"/>
                <stop offset=".52" stop-color="#edf1ed" stop-opacity=".2"/>
                <stop offset="1" stop-color="#d5e3e6" stop-opacity="0"/>
            </radialGradient>
            <filter id="soft-vapour" x="-.15" y="-.4" width="1.3" height="1.8">
                <feGaussianBlur stdDeviation="5"/>
            </filter>
        </defs>
    </svg>

    <svg class="life cloud-bank cloud-bank--near" viewBox="-140 -70 680 200"
         style="left:-140px;top:-70px;width:680px;height:200px" focusable="false">
        <g filter="url(#soft-vapour)">
            <ellipse cx="148" cy="33" rx="204" ry="51" fill="url(#cloud-soft)"/>
            <ellipse cx="321" cy="39" rx="135" ry="32" fill="url(#cloud-soft)"/>
            <ellipse cx="217" cy="15" rx="98" ry="40" fill="url(#cloud-soft)"/>
        </g>
    </svg>
    <svg class="life cloud-bank cloud-bank--far" viewBox="575 -65 805 175"
         style="left:575px;top:-65px;width:805px;height:175px" focusable="false">
        <g filter="url(#soft-vapour)">
            <ellipse cx="900" cy="28" rx="228" ry="40" fill="url(#cloud-soft)"/>
            <ellipse cx="1102" cy="14" rx="181" ry="38" fill="url(#cloud-soft)"/>
        </g>
    </svg>
    <svg class="life chimney-smoke" viewBox="800 35 64 75"
         style="left:800px;top:35px;width:64px;height:75px" focusable="false">
        <g fill="url(#foam-light)">
            <ellipse cx="821" cy="83" rx="13" ry="21"/>
            <ellipse cx="833" cy="61" rx="24" ry="20"/>
        </g>
    </svg>

    <!-- Où est l'eau, c'est la peinture qui le dit : le masque est relevé sur
         l'illustration elle-même — le bleu de l'eau, le blanc de ce qui tombe —
         donc il ne peut pas mentir sur un bâtiment. Il reste immobile ; seuls
         les fils d'eau glissent dessous. -->
    <div class="waters">
        <div class="fall fall--far">
            <svg class="life" viewBox="1290 40 220 165"
                 style="left:1290px;top:40px;width:220px;height:165px" focusable="false">
                <rect x="1290" y="40" width="220" height="165" fill="url(#fall-light)"/>
            </svg>
            <svg class="life fall__flow fall__flow--far" viewBox="1290 -40 220 320"
                 style="left:1290px;top:-40px;width:220px;height:320px" focusable="false">
                <rect x="1290" y="-40" width="220" height="320" fill="url(#fall-threads)"/>
            </svg>
        </div>
        <div class="fall fall--near">
            <svg class="life" viewBox="726 428 100 130"
                 style="left:726px;top:428px;width:100px;height:130px" focusable="false">
                <rect x="726" y="428" width="100" height="130" fill="url(#fall-light)"/>
            </svg>
            <!-- Un motif de plus en hauteur, coupé par un cadre immobile : au
                 début de chaque boucle, le bas de la cascade restait sans eau
                 une fraction de seconde. Le cadre garde exactement la zone que
                 le motif parcourait avant, pas un pixel de plus. -->
            <div class="fall__clip" style="left:720px;top:256px;width:115px;height:324px">
                <svg class="life fall__flow" viewBox="720 330 115 324"
                     style="left:0;top:74px;width:115px;height:324px" focusable="false">
                    <rect x="720" y="330" width="115" height="324" fill="url(#fall-threads)"/>
                </svg>
            </div>
        </div>
        <svg class="life fall-foam" viewBox="730 520 88 38"
             style="left:730px;top:520px;width:88px;height:38px" focusable="false">
            <ellipse cx="774" cy="539" rx="42" ry="17" fill="url(#foam-light)"/>
        </svg>
        <svg class="life fall-foam" viewBox="1301 164 148 42"
             style="left:1301px;top:164px;width:148px;height:42px" focusable="false">
            <ellipse cx="1375" cy="185" rx="72" ry="19" fill="url(#foam-light)"/>
        </svg>
        <svg class="life water-shimmer" viewBox="140 300 1080 450"
             style="left:140px;top:300px;width:1080px;height:450px" focusable="false">
            <rect x="140" y="300" width="1080" height="450" fill="url(#river-lines)"/>
        </svg>
        <svg class="life water-spark" viewBox="655 192 545 502"
             style="left:655px;top:192px;width:545px;height:502px" focusable="false">
            <path d="M1168 199h12 m10 3h4 M1117 242h7 M661 623h8 M837 688h11"
                  stroke="#f3ffff" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
        <svg class="life water-spark water-spark--late" viewBox="372 190 876 520"
             style="left:372px;top:190px;width:876px;height:520px" focusable="false">
            <path d="M982 197h7 M1230 215h12 M702 704h13 M763 669h6 M378 690h9"
                  stroke="#f3ffff" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
    </div>

    <svg class="life tavern-glow" viewBox="915 440 245 125"
         style="left:915px;top:440px;width:245px;height:125px" focusable="false">
        <g fill="url(#lamp-halo)">
            <ellipse cx="1041" cy="471" rx="23" ry="28"/>
            <ellipse cx="940" cy="527" rx="21" ry="24"/>
            <ellipse cx="1045" cy="537" rx="24" ry="25"/>
            <ellipse cx="1092" cy="534" rx="18" ry="24"/>
            <ellipse cx="1135" cy="538" rx="21" ry="22"/>
        </g>
    </svg>
    <svg class="life window-lights" viewBox="158 190 1246 332"
         style="left:158px;top:190px;width:1246px;height:332px" focusable="false">
        <g fill="url(#lamp-halo)">
            <ellipse cx="694" cy="216" rx="18" ry="23"/>
            <ellipse cx="704" cy="268" rx="20" ry="25"/>
            <ellipse cx="777" cy="278" rx="16" ry="23"/>
            <ellipse cx="853" cy="280" rx="16" ry="23"/>
            <ellipse cx="182" cy="494" rx="22" ry="26"/>
            <ellipse cx="1286" cy="363" rx="15" ry="21"/>
            <ellipse cx="1384" cy="369" rx="17" ry="24"/>
        </g>
    </svg>
    <svg class="life lantern-lights" viewBox="603 485 730 100"
         style="left:603px;top:485px;width:730px;height:100px" focusable="false">
        <g fill="url(#lamp-halo)">
            <circle cx="1279" cy="536" r="29"/>
            <circle cx="1312" cy="554" r="18"/>
            <circle cx="618" cy="500" r="13"/>
            <circle cx="884" cy="535" r="14"/>
        </g>
    </svg>
</div>
