<div class="game" id="game" data-view="monde">

    <div class="world" id="world">
        <div class="world__scene" id="scene">
            <img class="world__art" id="worldArt" width="1536" height="742" alt="Le domaine de Brewstead"
                 th:src="@{/images/brewstead-domaine.webp}" src="/images/brewstead-domaine.webp"
                 th:data-flou="@{/images/brewstead-domaine-flou.webp}" data-flou="/images/brewstead-domaine-flou.webp"
                 th:data-taverne="@{/images/lieux/taverne-salle.webp}" data-taverne="/images/lieux/taverne-salle.webp"
                 draggable="false">
            <div th:replace="~{game/brewstead-atmosphere :: atmosphere}"></div>
            <!-- Les calques sont posés par le script, qui ne sait pas calculer
                 l'empreinte d'un fichier. Le serveur la lui donne ici, sinon
                 ces sept images seraient les seules à garder leur ancien
                 contenu en cache après une mise à jour. -->
            <div class="world__lieux" id="lieux" aria-hidden="true"
                 th:attr="data-art-rucher=@{/images/lieux/rucher.webp},
                          data-art-champs=@{/images/lieux/champs.webp},
                          data-art-entrepot=@{/images/lieux/entrepot.webp},
                          data-art-brasserie=@{/images/lieux/brasserie.webp},
                          data-art-laboratoire=@{/images/lieux/laboratoire.webp},
                          data-art-taverne=@{/images/lieux/taverne.webp},
                          data-art-commandes=@{/images/lieux/commandes.webp}"></div>
            <div class="world__markers" id="markers"></div>
        </div>
        <div class="world__fx" aria-hidden="true">
            <span class="weather weather--rain"></span>
            <span class="weather weather--mist"></span>
        </div>
        <!-- « Glisse pour explorer » disait comment bouger la carte, jamais
             quoi faire du domaine. Cette place, la plus visible de l'écran,
             sert maintenant à dérouler la boucle du jeu une étape à la fois. -->
        <button class="world__guide" id="guide" type="button">
            <!-- Les quatre gestes de la boucle, cochés à mesure qu'on les fait.
                 La ligne du dessous dit quoi faire ; celle-ci, où l'on en est. -->
            <span class="world__guide-pas" id="guidePas" hidden></span>
            <span class="world__guide-face" aria-hidden="true"><svg class="art" viewBox="0 0 32 32"><use id="guideFace" href="#art-MEAD"/></svg></span>
            <span class="world__guide-text" id="guideText">—</span>
            <small class="world__guide-why" id="guideWhy"></small>
            <svg class="world__guide-go" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-chevron"/></svg>
        </button>
    </div>

    <!-- Un seul bandeau. Il y avait auparavant un blason, une carte de
         joueur, une barre de ressources, un parchemin d'objectif, une
         pastille de météo et un journal d'événements : six panneaux
         flottants pour dire qui tu es et ce que tu possèdes. Tout tient
         maintenant sur une ligne, et chaque élément y fait quelque chose. -->
    <header class="hud bandeau" id="bandeau">
        <button class="bandeau__joueur" id="playerCard" type="button" aria-label="Ouvrir mon compte">
            <span class="player__avatar" id="playerAvatar" aria-hidden="true"></span>
            <span class="player__body">
                <span class="player__name" id="playerName">—</span>
                <span class="player__xp">
                    <span class="bar"><i id="xpBar" style="width:0%"></i></span>
                    <small id="playerLevel">Niveau —</small>
                </span>
            </span>
        </button>

        <div class="bandeau__biens" id="resources" role="list"></div>

        <!-- L'objectif du jour tenait un parchemin entier dans le coin le
             plus précieux de l'écran, et y restait mort une fois rempli.
             Réduit à une pastille, il disparaît dès qu'il est acquis. -->
        <button class="bandeau__objectif" id="quest" type="button" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-compass"/></svg>
            <span class="bandeau__objectif-texte" id="questText">—</span>
            <span class="bandeau__objectif-compte" id="questCount">0/0</span>
        </button>

        <div class="effects" id="effects" hidden aria-live="polite"></div>

        <button class="round-btn bandeau__reglages" id="helpBtn" type="button" aria-label="Visite guidée" title="Visite guidée">
            <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-help"/></svg>
        </button>
        <button class="round-btn bandeau__reglages" id="renownBtn" type="button" aria-label="Renommée et hauts faits">
            <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-trophy"/></svg>
        </button>
        <button class="round-btn bandeau__reglages" id="settingsBtn" type="button" aria-label="Mon compte">
            <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-gear"/></svg>
        </button>

        <!-- Les sept lieux, toujours à portée, quelle que soit la taille de
             l'écran : c'est le seul chemin vers eux, avec la carte. Dans le
             flux du bandeau, sur sa propre ligne : une position calculée en
             « em » finissait par recouvrir les ressources dès que la taille
             du texte changeait. -->
        <nav class="places" id="places" aria-label="Les lieux du domaine"></nav>
    </header>

    <!-- La fanfare d'un haut fait. Elle passe devant tout le reste : un haut
         fait se gagne une fois, il mérite qu'on lève les yeux. -->
    <div class="hud feat" id="feat" role="status" aria-live="polite" hidden>
        <div class="feat__card">
            <span class="feat__burst" aria-hidden="true"></span>
            <svg class="feat__icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-trophy"/></svg>
            <p class="feat__kicker" id="featKicker">Haut fait débloqué</p>
            <h2 class="feat__title" id="featTitle">—</h2>
            <p class="feat__desc" id="featDesc"></p>
            <p class="feat__reward" id="featReward"></p>
            <div class="feat__actions">
                <button class="btn btn--gold feat__close" id="featGo" type="button" hidden>—</button>
                <button class="btn btn--gold feat__close" id="featClose" type="button">Continuer</button>
            </div>
        </div>
    </div>

    <button class="hud reap" id="reapBtn" type="button" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-basket"/></svg>
        <span>Tout récolter</span>
        <span class="reap__count" id="reapCount">0</span>
    </button>



    <section class="place" id="place" aria-live="polite" aria-hidden="true" tabindex="-1">
        <header class="place__head">
            <div>
                <small id="placeKicker">—</small>
                <h2 id="placeTitle">—</h2>
            </div>
            <button class="round-btn round-btn--ghost" id="placeClose" type="button" aria-label="Fermer">
                <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-close"/></svg>
            </button>
        </header>
        <p class="place__intro" id="placeIntro"></p>
        <div class="place__body" id="placeBody"></div>
        <footer class="place__foot">
            <button class="btn btn--gold" id="placeAction" type="button">Ouvrir</button>
        </footer>
    </section>

    <section class="screen" id="screen" aria-hidden="true" tabindex="-1">
        <div class="screen__sheet parchment">
            <header class="screen__head">
                <h2 id="screenTitle">—</h2>
                <button class="round-btn round-btn--ink" id="screenClose" type="button" aria-label="Fermer">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-close"/></svg>
                </button>
            </header>
            <div class="screen__body" id="screenBody"></div>
        </div>
    </section>

    <section class="fault" id="fault" aria-hidden="true" role="alertdialog" aria-labelledby="faultTitle">
        <div class="fault__sheet parchment">
            <h2 id="faultTitle">Domaine injoignable</h2>
            <p id="faultText"></p>
            <button class="btn btn--gold" type="button" id="faultRetry">Réessayer</button>
            <a class="btn btn--gold" th:href="@{/login}" href="/login" id="faultLogin" hidden>Se reconnecter</a>
        </div>
    </section>

    <form id="logoutForm" th:action="@{/logout}" action="/logout" method="post" hidden></form>

    <!-- Ce qui s'envole vers les compteurs : les gains, les récoltes. Un
         calque à part, au-dessus de tout, qui ne reçoit jamais le clic. -->
    <div class="envols" id="envols" aria-hidden="true"></div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<script th:src="@{/js/brewstead-cadence.js}" src="/js/brewstead-cadence.js"></script>
<script th:src="@{/js/brewstead-data.js}" src="/js/brewstead-data.js"></script>
<script th:src="@{/js/brewstead-world.js}" src="/js/brewstead-world.js"></script>
<script th:src="@{/js/brewstead-scenes.js}" src="/js/brewstead-scenes.js"></script>
<script th:src="@{/js/brewstead-visite.js}" src="/js/brewstead-visite.js"></script>
<script th:src="@{/js/brewstead-app.js}" src="/js/brewstead-app.js"></script>
</body>
</html>
