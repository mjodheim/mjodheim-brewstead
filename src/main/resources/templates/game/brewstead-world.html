<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#181710">
    <title>Mjödheim · Brewstead</title>
    <link rel="stylesheet" th:href="@{/css/brewstead-world.css}" href="/css/brewstead-world.css">
</head>
<body>
<div class="jeu" id="jeu" data-zone-active="domaine" data-weather="clear">
    <main class="scene" aria-label="Domaine de Brewstead">
        <img id="sceneImage" class="scene-image" th:src="@{/images/brewstead-reference.webp}" src="/images/brewstead-reference.webp" alt="" draggable="false">

        <div class="atmosphere" aria-hidden="true">
            <div class="sunlight"></div>
            <div class="cloud-light"></div>
            <div class="water-shimmer water-shimmer--lake"></div>
            <div class="water-shimmer water-shimmer--falls"></div>
            <div class="weather-layer weather-rain"></div>
            <div class="weather-layer weather-snow"></div>
            <div class="vignette"></div>
        </div>

        <button class="hotspot hotspot-rucher" type="button" data-zone="rucher" aria-label="Ouvrir le rucher"></button>
        <button class="hotspot hotspot-champs" type="button" data-zone="champs" aria-label="Ouvrir les champs"></button>
        <button class="hotspot hotspot-reserve" type="button" data-zone="reserve" aria-label="Ouvrir l'entrepôt"></button>
        <button class="hotspot hotspot-brasserie" type="button" data-zone="brasserie" aria-label="Ouvrir la brasserie"></button>
        <button class="hotspot hotspot-laboratoire" type="button" data-zone="laboratoire" aria-label="Ouvrir le laboratoire"></button>
        <button class="hotspot hotspot-taverne" type="button" data-zone="taverne" aria-label="Ouvrir la taverne"></button>
        <button class="hotspot hotspot-commandes" type="button" data-zone="commandes" aria-label="Ouvrir les commandes"></button>

        <aside class="panneau-lieu" id="panneauLieu" aria-live="polite" aria-hidden="true">
            <button class="close-panel" id="fermerPanneau" type="button" aria-label="Fermer">×</button>
            <small id="surtitreLieu">Mjödheim · Brewstead</small>
            <h2 id="titreLieu">Le domaine</h2>
            <p id="descriptionLieu"></p>
            <button class="primary-action" id="actionLieu" type="button">Ouvrir</button>
        </aside>

        <div class="notification" id="notification" role="status" aria-live="polite"></div>
    </main>
</div>
<script th:src="@{/js/brewstead-world.js}" src="/js/brewstead-world.js"></script>
</body>
</html>
